[package]
name = "sitool"
version = "0.1.0"
edition = "2024"

[build-dependencies]
xsd-parser = "1.4.0"

[dependencies]
clap = { version = "4.5.60", features = ["cargo"] }
urlencoding = "2.1.3"
uuid = { version = "1.22.0", features = ["v4"] }
wildmatch = "2.6.1"
xsd-parser-types = { version = "0.1.2", features = ["quick-xml"] }
zip = "8.1.0"
